services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/public/uploads

  # Одноразовый контейнер: применяет накопленные миграции при каждом старте
  # стека (`prisma migrate deploy`, не `migrate dev` — без интерактивных
  # вопросов и без учёта drift, годится для CI/прод). Переиспользует стадию
  # `dependencies` из Dockerfile — там уже есть Prisma CLI и schema.prisma,
  # полная сборка Next.js (стадия `builder`) для этого не нужна.
  migrate:
    build:
      context: .
      target: dependencies
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      # Только на localhost хоста — чтобы `npm run dev`/`prisma migrate` можно было
      # гонять прямо на хосте без входа в контейнер (см. .env.example, DATABASE_URL).
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Бэкапы — bind-mount на хост, а не именованный volume: `docker-compose down -v`
      # или чистая пересборка (задача 66) не должны уничтожать дампы вместе с остальными данными.
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  db-data:
  uploads:
